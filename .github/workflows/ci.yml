name: Release validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Ubuntu 24.04 x64 / X11 / Release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      PYTHONUTF8: '1'
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install build and X11 software-rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config git python3 \
            libtbb-dev libassimp-dev nlohmann-json3-dev libasound2-dev libgl1-mesa-dev \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev \
            xvfb xauth xdotool xclip x11-xserver-utils mesa-utils fonts-dejavu-core tini
      - name: Configure with pinned raylib 6.0
        run: |
          mkdir -p out/ci/logs
          bash scripts/ci-configure-linux.sh 2>&1 | tee out/ci/logs/configure.log
      - name: Build viewer, CLI and canonical tests
        run: python3 scripts/ci-test.py --build-dir out/build/ci-linux --phase build
      - name: C++ suites including four legacy suites
        run: python3 scripts/ci-test.py --build-dir out/build/ci-linux --phase unit
      - name: Standalone embedded guidance
        run: python3 scripts/ci-test.py --build-dir out/build/ci-linux --phase guidance
      - name: Public native acceptance on Xvfb and Mesa
        run: |
          tini -s -- xvfb-run -a -s '-screen 0 1920x1080x24 -noreset' \
            python3 scripts/ci-test.py --build-dir out/build/ci-linux --phase native
      - name: Required 150% and 200% X11 DPI input acceptance
        run: |
          tini -s -- xvfb-run -a -s '-screen 0 3000x2000x24 -noreset' \
            python3 scripts/ci-test.py --build-dir out/build/ci-linux --phase dpi
      - name: Retain test logs only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ubuntu-24.04-release-test-logs
          path: |
            out/ci/logs/*.log
            out/ci/logs/test-inventory.json
          if-no-files-found: warn
          retention-days: 14

  windows:
    name: Windows 2022 x64 / MSVC / Release
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      PYTHONUTF8: '1'
      VCPKG_DISABLE_METRICS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Configure MSVC and pinned vcpkg dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/ci/logs | Out-Null
          ./scripts/ci-configure-windows.ps1 *>&1 | Tee-Object out/ci/logs/configure.log
      - name: Build viewer, CLI and canonical tests
        run: python scripts/ci-test.py --build-dir out/build/ci-windows --phase build
      - name: C++ suites including four legacy suites
        run: python scripts/ci-test.py --build-dir out/build/ci-windows --phase unit
      - name: Standalone guidance and embedded icon
        run: python scripts/ci-test.py --build-dir out/build/ci-windows --phase guidance
      - name: Required public native acceptance and Windows icon/reload smoke
        run: python scripts/ci-test.py --build-dir out/build/ci-windows --phase native
      - name: Retain test logs only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-2022-release-test-logs
          path: |
            out/ci/logs/*.log
            out/ci/logs/test-inventory.json
          if-no-files-found: warn
          retention-days: 14
